[package]
name = "naoconcordo-painel"
version = "0.1.0"
description = "naoconcordo - painel de quem hospeda o servidor"
authors = ["naoconcordo"]
edition = "2024"

[lib]
name = "naoconcordo_painel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Baixar o LiveKit na primeira execucao e conferir o que veio.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Segredos do servidor: sal de autenticacao, chave e segredo do LiveKit.
rand = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
