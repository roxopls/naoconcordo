services:
  livekit:
    image: livekit/livekit-server:v1.9.7
    container_name: naoconcordo-livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  app:
    build: ../server
    container_name: naoconcordo-app
    restart: unless-stopped
    network_mode: host
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      # Quem emite convites e ve quem usou cada um.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_SALT: ${AUTH_SALT}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      # Busca de GIF. Opcionais: sem chave o botao nao aparece no aplicativo.
      GIF_PROVIDER: ${GIF_PROVIDER:-giphy}
      GIF_API_KEY: ${GIF_API_KEY:-}
      # Bot DJ. Sem o segredo, `/tocar` volta a ser mensagem comum e o painel de
      # fila nao aparece — o mesmo acordo da busca de GIF.
      DJ_SECRET: ${DJ_SECRET:-}
      # Chamadas privadas P2P (grupos e conversas a dois). A midia vai direto
      # entre as pessoas; estes enderecos so ajudam a achar o caminho. Sem
      # TURN_SECRET vai so o STUN, e quem esta atras de NAT dificil fica sem
      # repasse. Veja o servico `coturn` abaixo.
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      UPLOAD_FALLBACK_DIR: /app/uploads-fallback
    volumes:
      - naoconcordo-data:/app/data
      # Disco de 457G para anexos, e o de 1,4T como reserva quando encher.
      - /mnt/uploads/naoconcordo:/app/uploads
      - /mnt/storage/naoconcordo-uploads:/app/uploads-fallback
    depends_on: [livekit]

  # O bot de musica. Processo separado porque o yt-dlp quebra toda vez que o
  # YouTube muda alguma coisa, e o conserto e reconstruir esta imagem — nao uma
  # versao nova do backend.
  dj:
    build: ../dj
    container_name: naoconcordo-dj
    restart: unless-stopped
    # `host` como os outros: ele fala com o LiveKit e com o app pelo localhost,
    # e a rota de controle dele escuta so em 127.0.0.1.
    network_mode: host
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # O LiveKit de dentro da maquina: o endereco publico daria a volta pela
      # internet e dependeria do hairpin do roteador para voltar.
      DJ_LIVEKIT_URL: ${DJ_LIVEKIT_URL:-ws://127.0.0.1:7880}
      DJ_BACKEND_URL: ${DJ_BACKEND_URL:-http://127.0.0.1:3040}
      DJ_SECRET: ${DJ_SECRET:-}
    depends_on: [livekit, app]

  # Repasse das chamadas privadas, para quando as duas pontas nao conseguem se
  # ver direto. So repassa pacote ja cifrado (DTLS-SRTP): nao ve nem ouve nada.
  # A credencial e temporaria, emitida pelo `app` com o mesmo TURN_SECRET.
  #
  # Porta propria, fora da 3478 que o LiveKit ja usa. Precisa de
  # encaminhamento, em UDP e TCP, da 3479 e da faixa de repasse.
  coturn:
    image: coturn/coturn:4.6
    container_name: naoconcordo-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3479
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-naoconcordo}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --no-cli
      - --no-tls
      - --no-dtls
      # Repasse so para fora: sem isto o TURN serviria de ponte para a rede de
      # casa de quem hospeda.
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --fingerprint

  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    container_name: naoconcordo-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./updates:/srv/updates:ro
      # Versao que roda no navegador.
      - ./app:/srv/app:ro
      - naoconcordo-caddy-data:/data
      - naoconcordo-caddy-config:/config
    depends_on: [app]

volumes:
  naoconcordo-data:
  naoconcordo-caddy-data:
  naoconcordo-caddy-config:
